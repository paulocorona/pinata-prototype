<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e07830" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <title>Piñata Payday</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="phone-slot">
      <div id="app">
        <canvas id="game-canvas"></canvas>
        <div id="ui-root"></div>
        <div id="reticle" aria-hidden="true">
          <span class="ch-dot"></span>
        </div>
      </div>
    </div>
    <div id="rotate-gate" aria-hidden="true">
      <div class="rotate-gate-card">
        <div class="rotate-gate-phone" aria-hidden="true"></div>
        <p>Turn your phone upright</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
