<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e07830" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <title>Piñata Payday</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="phone-slot">
      <div id="app">
        <div id="game-layer">
          <canvas id="game-canvas"></canvas>
        </div>
        <div id="ui-root">
          <div class="overlay overlay-boot">
            <div class="boot-hero">
              <img class="boot-logo" src="./art/T_Logo.png" alt="Piñata Payday" draggable="false" />
              <div class="boot-actions">
                <button class="btn btn-primary boot-play interactive" data-start>PLAY</button>
                <button class="btn boot-shop interactive" data-shop>SHOP</button>
                <button class="btn boot-settings interactive" data-settings>SETTINGS</button>
              </div>
            </div>
          </div>
        </div>
        <div id="reticle" aria-hidden="true">
          <span class="ch-dot"></span>
        </div>
      </div>
    </div>
    <div id="rotate-gate" aria-hidden="true">
      <div class="rotate-gate-card">
        <div class="rotate-gate-phone" aria-hidden="true"></div>
        <p>Turn your phone upright</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
